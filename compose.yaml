# Production stack: the game server behind Caddy, which obtains and renews
# HTTPS certificates automatically. Usage:
#   cp .env.example .env   # set DOMAIN and ACCESS_CODE
#   docker compose up -d --build
services:
  app:
    build: .
    image: hues-and-cues-twitch:latest
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      TRUST_PROXY: 'true'
    volumes:
      - app-data:/data
    expose:
      - '8080'

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env to your hostname, e.g. 203-0-113-7.sslip.io}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  app-data:
  caddy-data:
  caddy-config:
